# Cloudflare Worker that proxies the APIs needing a secret key.
# Deploy:  cd worker && npm install && npx wrangler deploy
# Then put the deployed URL in ../src/config.ts → WORKER_ENDPOINT.

name = "profile-me-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# Non-secret configuration — edit freely.
# ALLOWED_ORIGIN: comma-separated allowlist. localhost entries let `npm run dev`
# reach the deployed worker; drop them once you're done testing if you like.
[vars]
ALLOWED_ORIGIN = "https://kubahlibre.github.io,http://localhost:4321,http://127.0.0.1:4321"
CACHE_SECONDS = "300"
OSU_USER_ID = ""
STEAM_ID = "76561199511026504"       # 64-bit id or vanity name; both work

# Guestbook storage. Create the DB once, then paste the printed database_id here:
#   npx wrangler d1 create profile-me-guestbook
#   npx wrangler d1 migrations apply profile-me-guestbook --remote
[[d1_databases]]
binding = "DB"
database_name = "profile-me-guestbook"
database_id = "1e5d7010-87ee-4e6c-99d2-923f1c9a607e"                   # <-- own DB, created via wrangler d1 create

# Secrets — never put these here. Set each with:
#   npx wrangler secret put OSU_CLIENT_ID
#   npx wrangler secret put OSU_CLIENT_SECRET
#   npx wrangler secret put STEAM_API_KEY
#   npx wrangler secret put SPOTIFY_CLIENT_ID
#   npx wrangler secret put SPOTIFY_CLIENT_SECRET
#   npx wrangler secret put SPOTIFY_REFRESH_TOKEN
#   npx wrangler secret put GUESTBOOK_ADMIN_TOKEN   # any long random string; lets you DELETE entries
